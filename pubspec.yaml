name: denuczi_tv
description: DenucziTV, an open-source IPTV player for Windows and Linux.
publish_to: none
version: 0.5.3+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  yaru: ^11.0.0
  provider: ^6.1.5+1
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  package_info_plus: ^10.2.2
  sqflite_common_ffi: ^2.4.5
  path_provider: ^2.1.5
  # Matches the Yaru 11 compatibility range (0.6 is a breaking API).
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Supplies the official in-memory SharedPreferencesAsync test implementation.
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/denuczitv_app_icon.png
