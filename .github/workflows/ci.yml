name: Flutter Desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'demo/**'
  # Keep pull-request checks consistent, including for protected branches.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, analyze, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libsqlite3-0 libsecret-1-0
      - name: Download dependencies
        run: flutter pub get
      - name: Generate localization
        run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  linux:
    name: Linux release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libmpv-dev mpv libsqlite3-0 libsqlite3-dev dpkg-dev binutils desktop-file-utils
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Debian binary
        run: bash scripts/package-deb.sh
      - name: Verify Debian package
        run: python3 -m unittest discover -s test/packaging -v
      - name: Upload Debian package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: denuczitv-linux-deb
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows release build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: |
          $env:CMAKE_TOOLCHAIN_FILE = (Resolve-Path 'packaging\windows\flutter-toolchain.cmake').Path
          flutter build windows --release
